name = "takasago-jhs-komu-ai-assist"
main = "worker.mjs"
compatibility_date = "2026-09-18"

[observability]
enabled = true
head_sampling_rate = 1

[[kv_namespaces]]
binding = "FAQ_KV"
id = "fff783123031417283650ca99d8661f1"

[[d1_databases]]
binding = "RAG_DB"
database_name = "takasago-jhs-komu-ai-rag"
database_id = "e060c9de-1315-4860-b5e1-e2b78193ffab"
migrations_dir = "migrations"

[[vectorize]]
binding = "RAG_VECTOR"
index_name = "takasago-jhs-komu-rag-v1"

[vars]
ALLOWED_ORIGINS = "https://kedamotohironobu-lang.github.io,http://localhost:8000,http://127.0.0.1:8000"
CEREBRAS_MODEL = "gpt-oss-120b"
GROQ_MODEL = "openai/gpt-oss-20b"
GEMINI_MODEL = "gemini-3.6-flash"
